default: &default
  adapter: postgresql
  encoding: unicode
  host: <%= ENV.fetch("DATABASE_HOST") { "localhost" } %>
  username: <%= ENV.fetch("POSTGRES_USER") %>
  password: <%= ENV.fetch("POSTGRES_PASSWORD") %>
  pool: 5

development:
  <<: *default
  database: <%= ENV.fetch("POSTGRES_DB") %>

test:
  <<: *default
  database: <%= ENV.fetch("POSTGRES_DB_TEST") { "guesteq_test" } %>

production:
  <<: *default
  database: <%= ENV.fetch("POSTGRES_DB") %>
